# Example lazyincus config, showing every option at its default value
# (except oS, which is commented out - see the note above that block).
#
# Copy what you need into your actual config file - you don't have to
# specify everything; omitted keys fall back to these defaults. See
# docs/Config.md for the full field reference, including config file
# locations and how to override them.

gui:
  # Lines scrolled at a time in the main panel.
  scrollHeight: 2

  # Only English is supported by this MVP.
  language: "en"

  # Whether you can scroll the main panel past its last line.
  scrollPastBottom: false

  # Set true to DISABLE mouse interaction (yes, the key name is backwards -
  # inherited as-is from lazydocker).
  mouseEvents: false

  theme:
    activeBorderColor:
      - green
      - bold
    inactiveBorderColor:
      - default
    selectedLineBgColor:
      - blue
    optionsTextColor:
      - blue

  # Skip the "press enter to return to lazyincus" prompt after a
  # subprocess (e.g. incus exec) finishes.
  returnImmediately: false

  # Give the focused side panel the space the others aren't using, instead
  # of splitting the side column evenly between all of them.
  expandFocusedSidePanel: false

  # Word-wrap the main panel's content.
  wrapMainPanel: true

  # Fraction of screen width used by the Instances side panel.
  sidePanelWidth: 0.3333

  # Show the bottom status/keybinding line.
  showBottomLine: true

  # Initial screen mode: "normal", "half", or "full"; changing it needs a
  # restart, unlike the rest of this file.
  screenMode: "normal"

  # Instance state display: "long" (full words), "short" (one/two
  # characters), or "icon".
  instanceStatusStyle: "long"

  # Panel border style: "rounded", "single", "double", or "hidden".
  border: "rounded"

  # Which columns the Instances panel shows, and in what order. Valid
  # values: name, status, type, ipv4, ipv6, snapshots. Unknown values are
  # ignored; list any subset to hide the rest.
  instanceColumns:
    - name
    - status
    - type
    - ipv4
    - ipv6
    - snapshots

# Prompt for confirmation when quitting with q/esc and no other panel is
# open.
confirmOnQuit: false

# oS is commented out by default: its real default is platform-specific
# (computed at startup, not a fixed zero value), so setting either key
# here - even to "" - would override that with an empty command. Uncomment
# and fill in only if you want a custom open command.
# oS:
#   # Command used to open a file. Platform defaults: macOS "open
#   # {{filename}}", Linux 'sh -c "xdg-open {{filename}} >/dev/null"'.
#   openCommand: ""
#   # Command used to open a URL. Platform defaults: macOS "open {{link}}",
#   # Linux 'sh -c "xdg-open {{link}} >/dev/null"'.
#   openLinkCommand: ""
#   # Command that copied text (e.g. an instance's IPv4 address) is piped
#   # into on its stdin. When unset, lazyincus uses the first of pbcopy,
#   # wl-copy, "xclip -selection clipboard -in" or "xsel --clipboard --input"
#   # that it finds on your PATH.
#   copyToClipboardCommand: ""

# List rows are hidden when any displayed column contains one of these
# substrings - status and IP addresses included, not just the name.
ignore: []
