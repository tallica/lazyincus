name: CI

# A `v*` tag runs the same checks as master and releases only if they pass.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    uses: tallica/workflows/.github/workflows/go.yml@v1
    permissions:
      contents: write # the release job creates the GitHub release
    with:
      format: false # no Prettier in this repo
