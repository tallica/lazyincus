name: CI

# A `v*` tag runs the same checks as master and releases only if they pass. A
# push that changes only CHANGELOG.md, like the release commit, runs nothing:
# the tag's run tests that commit once. Tags ignore path filters.
on:
  push:
    branches: [master]
    paths-ignore: ["CHANGELOG.md"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    uses: tallica/workflows/.github/workflows/go.yml@v1
    permissions:
      contents: write # the release job creates the GitHub release
    with:
      format: false # no Prettier in this repo
      notices: true
